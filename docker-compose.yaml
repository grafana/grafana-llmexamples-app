version: '3.0'

services:
  grafana:
    container_name: 'grafana-llmexamples-app'
    build:
      context: ./.config
      args:
        grafana_version: ${GRAFANA_VERSION:-10.0.3}
    environment:
      GF_INSTALL_PLUGINS: grafana-llm-app
      OPENAI_API_KEY: $OPENAI_API_KEY
    ports:
      - 3000:3000/tcp
    volumes:
      - ./dist:/var/lib/grafana/plugins/grafana-llmexamples-app
      - ./provisioning:/etc/grafana/provisioning

  qdrant:
    image: qdrant/qdrant@sha256:b3063c673f3973877c038eeecc392bad5011f072ee7892b56c9a8e204a3bdea9
    volumes:
      - qdrant-storage:/qdrant/storage

volumes:
  qdrant-storage:
